name: CI

on:
  push:
    branches: [main, bonus]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck & build (both workspaces)
        run: npm run build

      - name: Backend tests (vitest + supertest)
        run: npm run test -w apps/backend

      - name: Frontend tests (vitest + RTL + msw)
        run: npm run test -w apps/frontend
